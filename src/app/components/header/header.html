<header class="navbar">
  <div class="logo">
    <h2>Mi Tienda</h2>
  </div>
  
  <nav class="nav-links">
    <a routerLink="/">Inicio</a>
    <a routerLink="/products">Productos</a>
    <a routerLink="/categorias">Categorías</a>
    <a routerLink="/login">Inicio de sesion</a>
  </nav>

  <div class="cart-section">
    <button class="cart-btn">🛒 Carrito</button>

    <div class="user-status" *ngIf="sesionIniciada">
      <span class="status-dot" title="Sección iniciada"></span>
      <span class="status-text">Conectado</span>
      <button class="logout-btn" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>
</header>
